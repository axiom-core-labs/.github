name: Agent task
description: A task for an AI agent (OpenCode or Claude) to pick up and implement.
title: "[Task]: "
labels:
  - agent-task
body:
  - type: markdown
    attributes:
      value: |
        Write this for an agent, not a human. Be concrete and testable — objective, scope,
        and acceptance criteria should leave no ambiguity. Don't reference context the agent
        can't read (private chats, screenshots without alt text, "as discussed"); link or
        quote it instead.

  - type: markdown
    attributes:
      value: |
        Model label: `model:flash` (default), `model:deepseek`, `model:sonnet`.
        Intensity label: `intensity:low`, `intensity:high`, `intensity:max`.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: One sentence. The desired end state, not the steps to get there.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters. Link related issues, PRs, or docs.
    validations:
      required: false

