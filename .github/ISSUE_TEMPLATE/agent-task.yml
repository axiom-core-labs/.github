name: Agent task
description: A task for an AI agent (OpenCode or Claude) to pick up and implement.
title: "[Task]: "
labels:
  - agent-task
body:
  - type: markdown
    attributes:
      value: |
        Write this for an agent, not a human. Be concrete and testable — objective, scope,
        and acceptance criteria should leave no ambiguity.

  - type: markdown
    attributes:
      value: |
        Model label: `model:flash` (default), `model:deepseek`, `model:sonnet`.
        Intensity label: `intensity:low`, `intensity:high`, `intensity:max`.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: All relevant context for the issue.
    validations:
      required: true

