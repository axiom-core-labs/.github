name: Agent task
description: A task for an AI agent (OpenCode or Claude) to pick up and implement.
title: "[Task]: "
labels:
  - agent-task
body:
  - type: markdown
    attributes:
      value: |
        Write this for an agent, not a human. Be concrete and testable — objective, scope,
        and acceptance criteria should leave no ambiguity.

  - type: markdown
    attributes:
      value: |
        Model label — attach at most one; the label name is the full model id that
        will run (no aliases). If omitted, the default is DeepSeek V4.1 Flash:

        - `model:openrouter/deepseek/deepseek-v4.1-flash` — DeepSeek V4.1 Flash (default)
        - `model:openrouter/deepseek/deepseek-v4-pro-0813` — DeepSeek V4 Pro 0813
        - `model:openrouter/qwen/qwen3.8-flash` — Qwen3.8 Flash
        - `model:openrouter/qwen/qwen3.8-max-0902` — Qwen3.8 Max (0902)
        - `model:openrouter/z-ai/glm-5.3` — GLM 5.3
        - `model:openrouter/z-ai/glm-5.3-flash` — GLM 5.3 Flash
        - `model:openrouter/moonshotai/kimi-k3` — Kimi K3
        - `model:openrouter/meta/muse-spark-1.3-contributor` — Muse Spark 1.3 Contributor

        Intensity label: `intensity:low`, `intensity:high`, `intensity:max`.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: All relevant context for the issue.
    validations:
      required: true

