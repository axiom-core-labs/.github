name: Agent task
description: A task for a Claude agent to pick up and implement.
title: "[Task]: "
labels:
  - agent-task
body:
  - type: markdown
    attributes:
      value: |
        Write this for an agent, not a human. Be concrete and testable — objective, scope,
        and acceptance criteria should leave no ambiguity. Don't reference context the agent
        can't read (private chats, screenshots without alt text, "as discussed"); link or
        quote it instead.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: One sentence. The desired end state, not the steps to get there.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters. Link related issues, PRs, or docs.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files, directories, or repos the agent may touch.
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What the agent must NOT touch or change.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Checkbox list. This is the agent's definition of done.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Exact commands to run, e.g. `npm run build`, `npm run lint`, `npm test`.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      description: Select all that apply.
      options:
        - label: No new dependencies
        - label: No schema changes
        - label: No changes to CI / workflow files
        - label: Keep bundle size flat
    validations:
      required: false

  - type: dropdown
    id: deliverable
    attributes:
      label: Deliverable
      options:
        - PR only
        - PR + preview deploy
        - Investigation, no code
    validations:
      required: true

  - type: dropdown
    id: autonomy
    attributes:
      label: Autonomy
      options:
        - Agent may proceed unattended
        - Ask before implementing
    validations:
      required: true
