name: Bug
description: Something is broken.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Write this for an agent, not a human. Be concrete and testable — an agent should be
        able to reproduce the bug and verify the fix from this issue alone, without asking
        follow-up questions.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: One sentence. The desired end state (e.g. "X no longer happens when Y").
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters. Link related issues or PRs.
    validations:
      required: false

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a clean state.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs actual
      description: What you expected to happen, and what actually happened.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Repo, branch, browser/device, URL.
      value: |
        - Repo:
        - Branch:
        - Browser/device:
        - URL:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files, directories, or repos the agent may touch.
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What the agent must NOT touch or change.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Checkbox list. This is the agent's definition of done.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Exact commands to run, e.g. `npm run build`, `npm run lint`, `npm test`.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      description: Select all that apply.
      options:
        - label: No new dependencies
        - label: No schema changes
        - label: No changes to CI / workflow files
        - label: Keep bundle size flat
    validations:
      required: false

  - type: dropdown
    id: deliverable
    attributes:
      label: Deliverable
      options:
        - PR only
        - PR + preview deploy
        - Investigation, no code
    validations:
      required: true

  - type: dropdown
    id: autonomy
    attributes:
      label: Autonomy
      options:
        - Agent may proceed unattended
        - Ask before implementing
    validations:
      required: true
