name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read # Required for Claude to read CI results on PRs

jobs:
  claude:
    uses: axiom-core-labs/acl-cicd/.github/workflows/claude-code.yml@main
    secrets: inherit
